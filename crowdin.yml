# Crowdin <-> este repo: los tres archivos pequenos (menu principal, MCA, libros). Las misiones van en
# crowdin-misiones.yml porque en Crowdin viven dentro de una "rama" con otro nombre.
#
# "dest" es el nombre que el archivo YA tiene en Crowdin: asi no se crea ni se borra nada alli y se
# conservan todas las traducciones y aprobaciones. "translation" es donde va cada idioma en este repo,
# que tiene la misma estructura que la instancia de Minecraft.
# Credenciales: nunca aqui; son secretos del repositorio (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN).

"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."
"preserve_hierarchy": true

# update_as_unapproved: si cambia un texto en ingles, sus traducciones se conservan pero pierden la
# aprobacion, para que un corrector las vuelva a mirar.
"files": [
  {
    "source": "/kubejs/assets/biohazard/lang/en_us.json",
    "dest": "/main-menu-RP-en_us.json",
    "translation": "/kubejs/assets/biohazard/lang/%locale_with_underscore%.json",
    "update_option": "update_as_unapproved",
    "languages_mapping": { "locale_with_underscore": {
      "ar": "ar_sa", "bg": "bg_bg", "de": "de_de", "es-ES": "es_es", "fr": "fr_fr", "it": "it_it",
      "ja": "ja_jp", "ko": "ko_kr", "pl": "pl_pl", "pt-PT": "pt_pt", "pt-BR": "pt_br", "ru": "ru_ru",
      "tr": "tr_tr", "zh-CN": "zh_cn", "th": "th_th", "nl": "nl_nl", "sv-SE": "sv_se", "uk": "uk_ua",
      "vi": "vi_vn", "id": "id_id"
    } }
  },
  {
    "source": "/kubejs/assets/mca/lang/en_us.json",
    "dest": "/mca_introduction-en_us.json",
    "translation": "/kubejs/assets/mca/lang/%locale_with_underscore%.json",
    "update_option": "update_as_unapproved",
    "languages_mapping": { "locale_with_underscore": {
      "ar": "ar_sa", "bg": "bg_bg", "de": "de_de", "es-ES": "es_es", "fr": "fr_fr", "it": "it_it",
      "ja": "ja_jp", "ko": "ko_kr", "pl": "pl_pl", "pt-PT": "pt_pt", "pt-BR": "pt_br", "ru": "ru_ru",
      "tr": "tr_tr", "zh-CN": "zh_cn", "th": "th_th", "nl": "nl_nl", "sv-SE": "sv_se", "uk": "uk_ua",
      "vi": "vi_vn", "id": "id_id"
    } }
  },
  {
    "source": "/resourcepacks/BiohazardCustoms/assets/minecraft/lang/en_us.json",
    "dest": "/bh_customs-RP-en_us.json",
    "translation": "/resourcepacks/BiohazardCustoms/assets/minecraft/lang/%locale_with_underscore%.json",
    "update_option": "update_as_unapproved",
    "languages_mapping": { "locale_with_underscore": {
      "ar": "ar_sa", "bg": "bg_bg", "de": "de_de", "es-ES": "es_es", "fr": "fr_fr", "it": "it_it",
      "ja": "ja_jp", "ko": "ko_kr", "pl": "pl_pl", "pt-PT": "pt_pt", "pt-BR": "pt_br", "ru": "ru_ru",
      "tr": "tr_tr", "zh-CN": "zh_cn", "th": "th_th", "nl": "nl_nl", "sv-SE": "sv_se", "uk": "uk_ua",
      "vi": "vi_vn", "id": "id_id"
    } }
  }
]
