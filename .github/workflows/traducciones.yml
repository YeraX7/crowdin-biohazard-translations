# Traducciones de Biohazard: sincronizacion MANUAL con Crowdin. Nada se ejecuta solo.
# Actions > Traducciones > Run workflow > elegir que hacer:
#
#   comprobar            ensayo sin cambiar nada: dice que subiria y que bajaria (empezar siempre por aqui)
#   bajar-traducciones   trae de Crowdin lo traducido a una rama "traducciones-crowdin" y abre un pull
#                        request a main. main no cambia hasta que alguien lo revisa y lo mezcla.
#   subir-textos         sube a Crowdin los en_us.json de main (textos nuevos o cambiados del juego)
#
# El espanol no se sube desde aqui: lo hace el panel del estudio despues de revisarlo (la instancia tiene
# textos en ingles dentro de es_es.json y no deben llegar a Crowdin como espanol aprobado).
#
# Secretos del repositorio: CROWDIN_PROJECT_ID (853664) y CROWDIN_PERSONAL_TOKEN.

name: Traducciones

on:
  workflow_dispatch:
    inputs:
      accion:
        description: Que hacer
        required: true
        type: choice
        default: comprobar
        options: [comprobar, bajar-traducciones, subir-textos]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

env:
  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
  RAMA_MISIONES: '[YeraX7.crowdin-biohazard-translations] main'

jobs:
  comprobar:
    if: inputs.accion == 'comprobar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensayo - archivos pequenos
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          dryrun_action: true
          upload_sources: true
          download_translations: true
          push_translations: false
          create_pull_request: false
      - name: Ensayo - misiones
        uses: crowdin/github-action@v3
        with:
          config: crowdin-misiones.yml
          crowdin_branch_name: ${{ env.RAMA_MISIONES }}
          dryrun_action: true
          upload_sources: true
          download_translations: true
          push_translations: false
          create_pull_request: false

  bajar-traducciones:
    if: inputs.accion == 'bajar-traducciones'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar - archivos pequenos
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          user: auto
          upload_sources: false
          download_translations: true
          skip_untranslated_strings: true
          push_translations: false
          create_pull_request: false
      - name: Bajar - misiones
        uses: crowdin/github-action@v3
        with:
          config: crowdin-misiones.yml
          crowdin_branch_name: ${{ env.RAMA_MISIONES }}
          user: auto
          upload_sources: false
          download_translations: true
          skip_untranslated_strings: true
          push_translations: false
          create_pull_request: false
      - name: Rama y pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Crowdin no tiene nada distinto de main."; exit 0
          fi
          RAMA="traducciones-crowdin-$(date -u +%Y%m%d-%H%M)"
          git config user.name "Traducciones (accion manual)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add -A kubejs resourcepacks
          git commit -m "Traducciones de Crowdin ($(date -u +%Y-%m-%d))"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" --title "Traducciones de Crowdin $(date -u +%Y-%m-%d)" \
            --body "Bajadas de Crowdin con la accion manual. Revisar el diff antes de mezclar." \
            || echo "No se pudo abrir el PR automaticamente: abrelo desde la rama $RAMA."

  subir-textos:
    if: inputs.accion == 'subir-textos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir textos - archivos pequenos
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: false
          push_translations: false
          create_pull_request: false
      - name: Subir textos - misiones
        uses: crowdin/github-action@v3
        with:
          config: crowdin-misiones.yml
          crowdin_branch_name: ${{ env.RAMA_MISIONES }}
          upload_sources: true
          upload_translations: false
          download_translations: false
          push_translations: false
          create_pull_request: false
